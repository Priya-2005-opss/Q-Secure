
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Secure | Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Q-SECURE</h1>
            <p class="subtitle">Intelligent Email Security Platform</p>

            <div class="tabs">
                <button id="loginTab" class="active" type="button">Sign In</button>
                <button id="registerTab" type="button">Register</button>
            </div>

            <form id="loginForm">
                <h2>Welcome Back</h2>
                <input type="email" id="loginEmail" placeholder="Email address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <form id="registerForm" class="hidden">
                <h2>Create Account</h2>
                <input type="text" id="fullName" placeholder="Full name" required>
                <input type="email" id="registerEmail" placeholder="Email address" required>
                <input type="password" id="registerPassword"
                       placeholder="Password (minimum 8 characters)"
                       minlength="8" required>
                <button type="submit">Create Account</button>
            </form>

            <p id="message"></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
